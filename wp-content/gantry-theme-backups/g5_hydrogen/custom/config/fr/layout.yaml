  custom-9675:
    title: 'Custom HTML'
    attributes:
      html: ' <center> <h3 style="font-size:20px"> <p style="color:red"> Inégalité, exclusion et l''instabilité politique : le vrai coût de la corruption </p></h3> </strong>  <img src="https://cerc.cd/wp-content/uploads/2026/05/concern-rs76676-drc-crisis-bulengo-camp-1.webp"> <center>  <p  style="font-size:16px">La corruption est l’un des phénomènes les plus corrosifs de notre époque. Elle entraîne un gaspillage des ressources publiques, creuse les inégalités économiques et sociales, alimente le mécontentement et la polarisation politique et réduit la confiance à l’égard des institutions. </p> '
  custom-6353:
    title: 'Custom HTML'
    attributes:
      html: '<center> <h3 style="font-size:22px"> <p style="color:orange"> L''intégrité : une réponse stratégique et viable contre la corruption </p></h3> </center> <img src="https://cerc.cd/wp-content/uploads/2026/05/5677471-1701714747348-48304.webp">  <center> <p  style="font-size:16px">   <strong>L’intégrité publique</strong> constitue une réponse stratégique et viable face à la corruption. L''<strong>intégrité publique</strong> est essentielle à la mise en place d''institutions fortes et garantit aux citoyens que le gouvernement travaille dans leur intérêt, et pas seulement pour quelques privilégiés.  '
  custom-3557:
    title: 'Custom HTML'
